name: clip
# Cloud runner. The PC service (clip.py --watch) does the same job when the PC is on;
# a ⏳ reaction acts as a lock so both never process the same message.
on:
  schedule:
    - cron: "*/15 * * * *"  # GitHub may delay free-tier schedules by 1-4 hours
  workflow_dispatch:
    inputs:
      test_url:
        description: "Only test downloading this YouTube link (checks the cookies)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: clip
  cancel-in-progress: false
env:
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: "1561104377710772516"
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - if: inputs.test_url != ''
        uses: denoland/setup-deno@v2
      - if: inputs.test_url != ''
        name: Test download with cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TEST_URL: ${{ inputs.test_url }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U "yt-dlp[default]"
          printf '%s\n' "$YT_COOKIES" > cookies.txt
          yt-dlp --cookies cookies.txt -f "bv*[height<=1080]+ba/b" --download-sections "*0-20" -o test.mp4 "$TEST_URL"
          ls -lh test.*
      - id: check
        if: inputs.test_url == ''
        run: python clip.py --check
      - if: steps.check.outputs.has_work == 'true'
        uses: denoland/setup-deno@v2
      - if: steps.check.outputs.has_work == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
      - if: steps.check.outputs.has_work == 'true'
        run: python clip.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ github.token }}
