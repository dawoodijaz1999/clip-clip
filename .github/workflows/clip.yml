name: clip
# Cloud runner. The PC service (clip.py --watch) does the same job when the PC is on;
# a ⏳ reaction acts as a lock so both never process the same message.
on:
  schedule:
    - cron: "*/15 * * * *"  # GitHub may delay free-tier schedules by 1-4 hours
  workflow_dispatch:
    inputs:
      test_url:
        description: "Only test downloading this YouTube link (checks the cookies)"
        required: false
        default: ""
      test_tiktok:
        description: "Only test: send this clip URL to the TikTok inbox as a draft"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: clip
  cancel-in-progress: false
env:
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_CHANNEL_ID: "1561104377710772516"
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - if: inputs.test_url != ''
        uses: denoland/setup-deno@v2
      - if: inputs.test_url != ''
        name: Test download with cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TEST_URL: ${{ inputs.test_url }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -U "yt-dlp[default]"
          printf '%s\n' "$YT_COOKIES" > cookies.txt
          yt-dlp --cookies cookies.txt -f "bv*[height<=1080]+ba/b" --download-sections "*0-20" -o test.mp4 "$TEST_URL"
          ls -lh test.*
      - if: inputs.test_tiktok != ''
        name: Test TikTok draft upload
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TEST_TIKTOK: ${{ inputs.test_tiktok }}
        run: |
          curl -sSfL -o test_clip.mp4 "$TEST_TIKTOK"
          python -c "import posting, pathlib; print('publish_id:', posting.post_tiktok_draft(pathlib.Path('test_clip.mp4')))"
      - id: check
        if: inputs.test_url == '' && inputs.test_tiktok == ''
        run: python clip.py --check
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      - if: steps.check.outputs.has_work == 'true'
        uses: denoland/setup-deno@v2
      - if: steps.check.outputs.has_work == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
      - if: steps.check.outputs.has_work == 'true'
        run: python clip.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GH_TOKEN: ${{ github.token }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      - if: always() && steps.check.outputs.has_work == 'true'
        name: Save post queue
        run: |
          if [ -n "$(git status --porcelain queue.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -q -m "Update post queue"
            git pull -q --rebase && git push -q
          fi
