name: keepalive
# GitHub pauses scheduled workflows in public repos after 60 days without activity.
# Once a month: commit a timestamp (counts as activity) and make sure "clip" is enabled.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive" && git push
      - name: Re-enable clip workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable clip.yml -R ${{ github.repository }}
